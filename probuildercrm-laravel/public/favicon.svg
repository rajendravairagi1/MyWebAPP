<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dabf7"/>
      <stop offset="100%" stop-color="#155fc4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <g fill="#ffffff">
    <!-- three buildings, tallest in the middle -->
    <polygon points="52,150 52,95 78,80 78,150" opacity="0.97"/>
    <polygon points="86,150 86,60 114,60 114,150" opacity="0.97"/>
    <polygon points="122,150 122,80 148,95 148,150" opacity="0.97"/>
  </g>

  <!-- wide roof chevron spanning across the buildings -->
  <path d="M34 152 L100 106 L166 152 L148 152 L100 119 L52 152 Z" fill="#ffffff"/>

  <!-- small house window grid sitting under the roofline -->
  <g fill="#ffffff">
    <rect x="89" y="131" width="9" height="9" rx="1.3"/>
    <rect x="102" y="131" width="9" height="9" rx="1.3"/>
    <rect x="89" y="144" width="9" height="9" rx="1.3"/>
    <rect x="102" y="144" width="9" height="9" rx="1.3"/>
  </g>
</svg>
