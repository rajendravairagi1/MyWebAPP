name: HazriBook APK

on:
  push:
    paths: ['shram_khata/**', '.github/workflows/shram-khata-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shram_khata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test test/services_test.dart test/pdf_test.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: shram-khata-apk
          path: shram_khata/build/app/outputs/flutter-apk/app-release.apk
